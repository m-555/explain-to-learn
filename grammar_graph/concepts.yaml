- id: verb_form_after_to
  name: Base form after to
  status: draft
  rules:
    A2: >-
      After to, use the base form of the verb: to go, to eat. Do not add -ing,
      -s or -ed to it.
    B1: >-
      When to comes before a verb (want to, like to, decide to), the verb after
      it is in the base form: I want to go, not I want to going.
    B2: >-
      In a to-infinitive the verb is always in the base form: She hopes to win.
      Be careful: in some phrases to is a preposition, and then the verb takes
      -ing: I look forward to seeing you.
  example:
    wrong: We decided to going home early.
    right: We decided to go home early.
  prerequisites: [present_simple]
  terms:
    A2: [verb, base form]
    B1: [infinitive]
    B2: [to-infinitive, preposition]

