# Determiners

- id: articles_a_an_the
  name: Articles a, an and the
  status: draft
  rules:
    A2: >-
      Use a or an for one thing when you talk about it for the first time: a dog,
      an egg. Use an before a vowel sound. Use the when the listener knows which
      thing you mean: the dog in my garden.
    B1: >-
      Use a or an with a singular countable noun when the reader does not know
      which one you mean yet. Use the when they do know: you have mentioned it
      before, or there is only one. Do not use a or an with plural or uncountable
      nouns.
    B2: >-
      A singular countable noun needs a determiner. Use a or an for something
      new or not specific, and the for something specific, already mentioned or
      unique. Plural and uncountable nouns take no article when the meaning is
      general: Music helps me relax.
  example:
    wrong: I saw a film last night. A film was very funny.
    right: I saw a film last night. The film was very funny.
  prerequisites: [noun_plurals, countable_uncountable_nouns]
  terms:
    A2: [noun, vowel]
    B1: [article, singular, countable, uncountable]
    B2: [determiner, specific]

