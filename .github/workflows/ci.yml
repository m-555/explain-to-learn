name: CI

on:
  push:
  pull_request:

# No GPU and no model downloads. Tests that need ERRANT with spaCy's English model skip;
# run them locally after `pip install -e ".[data]"` and `python -m spacy download
# en_core_web_sm`.
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,graph,generate]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q -rs
      - name: Command-line tool
        run: explain-to-learn --help

  # Gradio is large, so the demo's interface is built in a separate job that runs
  # alongside the main one.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,graph,generate,demo]"
      - name: Build the demo and the annotation app
        run: pytest -q -rs tests/test_demo.py tests/test_annotation_app.py
