# Verbs: tenses and agreement

- id: present_simple
  name: Present simple
  status: draft
  rules: {A2: "", B1: "", B2: ""}
  example: {wrong: "", right: ""}
  prerequisites: []
  terms: {A2: [], B1: [], B2: []}

- id: subject_verb_agreement
  name: Subject-verb agreement
  status: draft
  rules:
    A2: >-
      After he, she, it or one person or thing, add -s to the verb in the present
      simple: she likes, my dad works. After I, you, we and they, do not add -s.
    B1: >-
      In the present simple, a singular subject (he, she, it, one person or thing)
      takes a verb with -s; a plural subject takes the base form. The same rule
      gives does/do, has/have and was/were.
    B2: >-
      The verb must agree with its subject in number. Find the real subject, even
      when other words come between it and the verb: The list of names is long.
      A singular subject takes -s in the present simple and was in the past of be.
  example:
    wrong: My brother play football every Sunday.
    right: My brother plays football every Sunday.
  prerequisites: [present_simple, personal_pronouns, noun_plurals]
  terms:
    A2: [verb, present simple, singular, plural]
    B1: [subject, base form]
    B2: [agreement, auxiliary]

